<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title">
  <title id="title">Aimar Méndez — Junior DevOps &amp; SysAdmin, Canary Islands</title>
  <style>
    /* Fuente del sistema: GitHub sirve el SVG como imagen y no carga fuentes externas */
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
    .muted { fill: #59636e; }
    /* Verde oscurecido: el #3fb950 del modo oscuro no llega a 4.5:1 sobre blanco */
    .accent { fill: #1a7f37; }
    .name { font-size: 34px; font-weight: 700; fill: #1f2328; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <clipPath id="window"><rect x="0.5" y="0.5" width="959" height="299" rx="12" /></clipPath>
  <g clip-path="url(#window)">
    <rect width="960" height="300" fill="#ffffff" />
    <rect width="960" height="40" fill="#f6f8fa" />
    <line x1="0" y1="40.5" x2="960" y2="40.5" stroke="#d1d9e0" />
  </g>
  <rect x="0.5" y="0.5" width="959" height="299" rx="12" fill="none" stroke="#d1d9e0" />
  <circle cx="24" cy="20" r="6" fill="#d1d9e0" />
  <circle cx="44" cy="20" r="6" fill="#d1d9e0" />
  <circle cx="64" cy="20" r="6" fill="#d1d9e0" />
  <text x="480" y="25" font-size="13" text-anchor="middle" class="muted">aimar@canary-islands: ~</text>

  <text x="40" y="94" font-size="18"><tspan class="accent">$</tspan> whoami</text>
  <text x="40" y="138" class="name">Aimar Méndez</text>
  <text x="40" y="174" font-size="18" class="muted">Junior DevOps &amp; SysAdmin · Infrastructure · Automation · Databases</text>
  <text x="40" y="222" font-size="18"><tspan class="accent">$</tspan> uptime</text>
  <text x="40" y="252" font-size="18" class="muted">building reliable systems from the Canary Islands <tspan class="accent cursor">█</tspan></text>
</svg>
